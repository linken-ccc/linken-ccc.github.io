<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>林 | Personal Page</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
        }
        :root {
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-main: #222222;
            --text-second: #555555;
            --text-light: #777777;
            --text-hint: #aaaaaa;
            --border-line: #cccccc;
            --hover-text: #000000;
            --shadow: rgba(0, 0, 0, 0.06);
            --modal-mask: rgba(0, 0, 0, 0.4);
        }
        body.dark {
            --bg-color: #121418;
            --card-bg: #1e2127;
            --text-main: #f0f0f0;
            --text-second: #c8c8c8;
            --text-light: #999999;
            --text-hint: #666666;
            --border-line: #444444;
            --hover-text: #ffffff;
            --shadow: rgba(0, 0, 0, 0.3);
            --modal-mask: rgba(0, 0, 0, 0.7);
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: background-color 0.4s ease, color 0.4s ease;
        }
        .main-content {
            width: 100%;
            position: relative;
        }
        /* 修复：页面容器不拦截鼠标点击，防止遮挡箭头 */
        .page-wrap {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            position: relative;
            pointer-events: none;
        }
        .page {
            text-align: center;
            padding: 80px 60px;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 8px 30px var(--shadow);
            max-width: 520px;
            width: 90%;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.4s ease, transform 0.4s ease, background 0.4s;
            position: absolute;
            pointer-events: none;
        }
        .page.active {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }
        .name {
            font-size: 46px;
            font-weight: 500;
            letter-spacing: 12px;
            margin-bottom: 16px;
        }
        .en-name {
            font-size: 16px;
            color: var(--text-light);
            letter-spacing: 3px;
            margin-bottom: 40px;
            font-weight: 300;
        }
        .line {
            width: 70px;
            height: 1px;
            background: var(--border-line);
            margin: 0 auto 40px;
        }
        .intro {
            font-size: 15px;
            color: var(--text-second);
            line-height: 2;
            margin-bottom: 30px;
        }
        .file-list {
            text-align: left;
            max-width: 300px;
            margin: 0 auto;
            font-size: 15px;
        }
        .file-item {
            padding: 8px 0;
            color: var(--text-second);
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.25s ease;
            border-radius: 6px;
            padding-left: 6px;
        }
        .file-item:hover {
            color: var(--hover-text);
            padding-left: 12px;
            background: rgba(128,128,128,0.08);
        }
        .folder-icon::before { content:"📁"; }
        .txt-icon::before { content:"📄"; }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--modal-mask);
            z-index: 999;
            align-items: center;
            justify-content: center;
        }
        .modal-box {
            background: var(--card-bg);
            width: 90%;
            max-width: 480px;
            padding: 30px;
            border-radius: 12px;
            transition: background 0.4s;
        }
        .modal h3 {
            margin-bottom: 16px;
            color: var(--text-main);
        }
        .modal-content {
            min-height: 120px;
            line-height: 1.8;
            color: var(--text-second);
            white-space: pre-wrap;
            max-height: 70vh;
            overflow-y: auto;
        }
        .close-modal {
            margin-top: 20px;
            padding: 8px 24px;
            border: 1px solid var(--border-line);
            background: transparent;
            color: var(--text-main);
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
        }
        .close-modal:hover {
            background: rgba(128,128,128,0.1);
        }
        .modal.show {
            display: flex;
        }
        .arrow {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            font-size: 40px;
            color: var(--text-light);
            cursor: pointer;
            user-select: none;
            transition: color 0.3s;
            padding: 16px;
            z-index: 10;
            /* 强制可点击 */
            pointer-events: auto !important;
        }
        .arrow:hover {
            color: var(--hover-text);
        }
        .prev { left: 30px; }
        .next { right: 30px; }
        .arrow.disabled {
            color: #666;
            opacity: 0.3;
            cursor: default;
            pointer-events: none;
        }
        .page-index {
            position: fixed;
            bottom: 60px;
            font-size: 13px;
            color: var(--text-light);
        }
        .footer {
            position: fixed;
            bottom: 20px;
            font-size: 12px;
            color: var(--text-hint);
            text-align: center;
            width: 100%;
            line-height: 1.6;
        }
        .theme-btn {
            position: fixed;
            bottom: 60px;
            right: 30px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1px solid var(--border-line);
            background: var(--card-bg);
            color: var(--text-main);
            font-size: 18px;
            cursor: pointer;
            z-index: 10;
            transition: all 0.3s;
        }
        .theme-btn:hover {
            transform: scale(1.1);
        }
        @media (max-width: 480px) {
            .name {
                font-size: 32px;
                letter-spacing: 8px;
            }
            .page {
                padding: 50px 30px;
            }
            .prev { left: 0; }
            .next { right: 0; }
            .arrow {
                font-size: 28px;
                padding: 20px 10px;
            }
            .theme-btn {
                right: 15px;
                bottom: 50px;
            }
        }
    </style>
    <script src="//cdn.busuanzi.cc/busuanzi/3.6.9/busuanzi.min.js" defer></script>
</head>
<body>
    <div class="main-content">
        <button class="theme-btn" id="themeToggle">🌙</button>
        <div class="arrow prev" id="prevBtn">←</div>
        <div class="arrow next" id="nextBtn">→</div>
        <div class="page-wrap">
            <div class="page active" data-page="1">
                <h1 class="name">林</h1>
                <p class="en-name">LIN</p >
                <div class="line"></div>
                <div class="intro">这是我的小站</div>
            </div>
            <div class="page" data-page="2">
                <h1 class="name">你好</h1>
                <p class="en-name">HELLO</p >
                <div class="line"></div>
                <div class="intro">很高兴与你相遇</div>
            </div>
            <div class="page" data-page="3">
                <h1 class="name">文件</h1>
                <p class="en-name">FILE LIST</p >
                <div class="line"></div>
                <div class="intro">站内文件清单（点击文件打开）</div>
                <div class="file-list">
                    <div class="file-item folder-icon" data-file="archive">archive</div>
                    <div class="file-item txt-icon" data-file="longtext">龙 Z1   quan集.txt</div>
                    <div class="file-item txt-icon" data-file="blank">空白文档.txt</div>
                </div>
            </div>
        </div>
        <div class="modal" id="fileModal">
            <div class="modal-box">
                <h3 id="modalTitle"></h3>
                <div class="modal-content" id="modalText"></div>
                <button class="close-modal">关闭</button>
            </div>
        </div>
        <div class="page-index" id="pageText">第 1 / 3 页</div>
        <div class="footer">
            © 2026 林 All Rights Reserved<br>
            今日总访问量 <span id="busuanzi_today_pv">--</span> 次
            今日总访客数 <span id="busuanzi_today_uv">--</span> 人<br>
            本站总访问量 <span id="busuanzi_site_pv">--</span> 次
            本站总访客数 <span id="busuanzi_site_uv">--</span> 人<br>
            本页总阅读量 <span id="busuanzi_page_pv">--</span> 次
            本页总访客数 <span id="busuanzi_page_uv">--</span> 人
        </div>
    </div>
<script>
// 修复：补全longtext反引号，修复JSON语法错误
const fileData = {
    archive: "暂无文件夹内容",
    longtext: "这里是龙 Z1 quan集文本内容",
    blank: "空白文档，暂无内容"
};
// 所有逻辑写在DOM加载完成后
document.addEventListener('DOMContentLoaded', function(){
    // 获取DOM元素
    const pages = document.querySelectorAll('.page');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const pageText = document.getElementById('pageText');
    const themeToggle = document.getElementById('themeToggle');
    const modal = document.getElementById('fileModal');
    const modalTitle = document.getElementById('modalTitle');
    const modalText = document.getElementById('modalText');
    const closeModalBtn = document.querySelector('.close-modal');
    const fileItems = document.querySelectorAll('.file-item');
    let currentPage = 1;
    const totalPage = pages.length;
    // 更新页码、按钮禁用状态
    function updatePageUI(){
        // 更新底部页码文字
        pageText.textContent = `第 ${currentPage} / ${totalPage} 页`;
        // 首页禁用上一页
        if(currentPage <= 1){
            prevBtn.classList.add('disabled');
        }else{
            prevBtn.classList.remove('disabled');
        }
        // 末页禁用下一页
        if(currentPage >= totalPage){
            nextBtn.classList.add('disabled');
        }else{
            nextBtn.classList.remove('disabled');
        }
    }
    // 切换页面函数
    function switchPage(targetNum){
        // 边界判断
        if(targetNum < 1 || targetNum > totalPage) return;
        // 移除所有active
        pages.forEach(page => page.classList.remove('active'));
        // 给目标页面加active
        document.querySelector(`.page[data-page="${targetNum}"]`).classList.add('active');
        currentPage = targetNum;
        updatePageUI();
    }
    // 上一页点击
    prevBtn.addEventListener('click', function(){
        switchPage(currentPage - 1);
    });
    // 下一页点击
    nextBtn.addEventListener('click', function(){
        switchPage(currentPage + 1);
    });
    // 深色浅色切换
    themeToggle.addEventListener('click', function(){
        document.body.classList.toggle('dark');
        if(document.body.classList.contains('dark')){
            themeToggle.textContent = '☀️';
        }else{
            themeToggle.textContent = '🌙';
        }
    });
    // 文件点击弹出弹窗
    fileItems.forEach(item => {
        item.addEventListener('click', function(){
            const fileKey = this.dataset.file;
            const title = this.textContent.trim();
            modalTitle.textContent = title;
            modalText.textContent = fileData[fileKey];
            modal.classList.add('show');
        });
    });
    // 关闭弹窗按钮
    closeModalBtn.addEventListener('click', function(){
        modal.classList.remove('show');
    });
    // 点击弹窗遮罩层关闭
    modal.addEventListener('click', function(e){
        if(e.target === modal){
            modal.classList.remove('show');
        }
    });
    // 初始化UI
    updatePageUI();
});
</script>
</body>
</html>

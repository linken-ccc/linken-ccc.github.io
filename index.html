<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 移动端自适应 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>林 | Personal Page</title>
    <style>
        /* 全局样式重置，统一简约基调 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "PingFang SC", "Microsoft YaHei", 思源黑体, sans-serif;
        }

        body {
            background-color: #f8f9fa;
            color: #222222;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: all 0.4s ease;
        }

        /* 默认隐藏主页内容（密码验证） */
        .main-content{
            display: none;
            width: 100%;
            position: relative;
        }

        /* 页面容器 */
        .page-wrap {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* 页面卡片样式 */
        .page {
            text-align: center;
            padding: 80px 60px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
            max-width: 520px;
            width: 90%;
            display: none;
        }
        .page.active {
            display: block;
        }

        /* 姓名主标题 */
        .name {
            font-size: 46px;
            font-weight: 500;
            letter-spacing: 12px;
            margin-bottom: 16px;
        }

        /* 英文副标题 */
        .en-name {
            font-size: 16px;
            color: #777777;
            letter-spacing: 3px;
            margin-bottom: 40px;
            font-weight: 300;
        }

        /* 分割细线 */
        .line {
            width: 70px;
            height: 1px;
            background: #cccccc;
            margin: 0 auto 40px;
        }

        /* 简介文字区域 */
        .intro {
            font-size: 15px;
            color: #555555;
            line-height: 2;
            margin-bottom: 50px;
        }

        /* 导航链接行 */
        .links {
            display: flex;
            gap: 36px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .links a {
            text-decoration: none;
            color: #444444;
            font-size: 14px;
            letter-spacing: 1px;
            transition: color 0.3s;
        }
        .links a:hover {
            color: #000000;
        }

        /* 翻页箭头 */
        .arrow {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            font-size: 40px;
            color:#999;
            cursor: pointer;
            user-select: none;
            transition: color 0.3s;
            padding: 10px;
        }
        .arrow:hover{
            color:#222;
        }
        .prev {
            left: 30px;
        }
        .next {
            right: 30px;
        }
        /* 不可点击时变浅 */
        .arrow.disabled{
            color:#ddd;
            cursor: default;
        }

        /* 页码指示器 */
        .page-index{
            position: fixed;
            bottom: 30px;
            font-size:13px;
            color:#999;
        }

        /* 底部小字版权 */
        .footer {
            margin-top: 40px;
            font-size: 12px;
            color: #aaaaaa;
        }

        /* 手机端适配 */
        @media (max-width: 480px) {
            .name {
                font-size: 32px;
                letter-spacing: 8px;
            }
            .page {
                padding: 50px 30px;
            }
            .prev{
                left:8px;
            }
            .next{
                right:8px;
            }
            .arrow{
                font-size:28px;
            }
        }
    </style>
</head>
<body>
    <div class="main-content">
        <!-- 左箭头 -->
        <div class="arrow prev" id="prevBtn">←</div>
        <!-- 右箭头 -->
        <div class="arrow next" id="nextBtn">→</div>

        <div class="page-wrap">
            <!-- 第1页 -->
            <div class="page active" data-page="1">
                <h1 class="name">林</h1>
                <p class="en-name">LIN</p>
                <div class="line"></div>
                <div class="intro">
                    这是我的小站
                </div>
            </div>

            <!-- 第2页 -->
            <div class="page" data-page="2">
                <h1 class="name">你好</h1>
                <p class="en-name">HELLO</p>
                <div class="line"></div>
                <div class="intro">
                    很高兴与你相遇
                </div>
            </div>

            <!-- 第3页 -->
            <div class="page" data-page="3">
                <h1 class="name">这是我的网站</h1>
                <p class="en-name">MY WEBSITE</p>
                <div class="line"></div>
                <div class="intro">
                    欢迎来到我的个人主页
                </div>
            </div>
        </div>

        <!-- 页码显示 -->
        <div class="page-index" id="pageText">第 1 / 3 页</div>

        <!-- 底部版权 -->
        <div class="footer">
            © 2026 林 All Rights Reserved
            <script src="//cdn.busuanzi.cc/busuanzi/3.6.9/busuanzi.min.js" defer></script>
今日总访问量 <span id="busuanzi_today_pv">加载中...</span> 次
今日总访客数 <span id="busuanzi_today_uv">加载中...</span> 人
本站总访问量 <span id="busuanzi_site_pv">加载中...</span> 次
本站总访客数 <span id="busuanzi_site_uv">加载中...</span> 人
本页总阅读量 <span id="busuanzi_page_pv">加载中...</span> 次
本页总访客数 <span id="busuanzi_page_uv">加载中...</span> 人
            print("niha   hello“）
        </div>
    </div>

<script>
// 访问密码
const PASSWORD = "123456";

window.onload = function(){
    let inputPwd = prompt("请输入访问密码：");
    while(inputPwd !== PASSWORD){
        inputPwd = prompt("密码错误，请重新输入！");
    }
    document.querySelector('.main-content').style.display = 'block';
    initPageSwitch();
}

// 翻页逻辑
function initPageSwitch(){
    const pages = document.querySelectorAll('.page');
    const totalPage = pages.length;
    let current = 1;

    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const pageText = document.getElementById('pageText');

    function updateUI(){
        // 切换页面显示
        pages.forEach(p=>p.classList.remove('active'));
        document.querySelector(`.page[data-page="${current}"]`).classList.add('active');
        pageText.innerText = `第 ${current} / ${totalPage} 页`;

        // 首尾页禁用箭头
        prevBtn.classList.toggle('disabled', current === 1);
        nextBtn.classList.toggle('disabled', current === totalPage);
    }

    prevBtn.onclick = ()=>{
        if(current > 1){
            current--;
            updateUI();
        }
    }
    nextBtn.onclick = ()=>{
        if(current < totalPage){
            current++;
            updateUI();
        }
    }
    updateUI();
}
</script>
</body>
</html>

    longtext: `路明非在屏幕上无奈地打出 “GG”（“GG”，指 “GoodGame”，在竞技类游戏中称赞对方玩得好，也是认负的意思），而后切出了游戏。屏幕上显示的最后一个场景，是十二艘人类巡洋舰以华丽的大和炮聚焦射击，把他的母巢化作了一滩血水。人与社会
　　他输掉了今天的第六局，胜负比例是零比六，这一次他坚持到了 22 分 23 秒才被拿下，不过最终还是被拿下了，对方的微操很好，用的又是人类，人类的机枪兵在这个游戏里是个变态的兵种，出枪速度为零，站住了拔枪就射，收枪就跑，路明非的小狗追不上，在路上就一只只被打爆了。
　　公共聊天频道里，对手正侃侃而谈，“人类打虫族未必要出坦克，高手都不太出坦克了，开始就爆兵，海量的机枪混着护士冲过去，连消带打，看住对方小狗没有升级速度之前压制住了，他就只有不断出兵跟你磨，他刺蛇不能成队你就赢了，后面巡洋舰编队出击，那是压倒性的啊……” 路明非可以想像那家伙眉飞色舞的样子。
　　路明非没啃声儿，切到 QQ 上，那个戴棒球帽的女孩头像还是灰色的，一动不动。对方没上线，又白等了。他抓了抓脑袋，有点失望。另一个头像倒是跳了起来，是个长得很欠的熊猫。
　　“兄弟你虫族玩得不错了，下次再切！” 熊猫是那个打赢了他的家伙，“你就差在微操上，战术意识是很好的。”
　　“好呀。” 路明非说。
　　熊猫得意洋洋地下线了，路明非冲着屏幕吐了吐舌头。如果对方亲眼看见路明非的操作，大概就不会得意了，只会骂一句 “变态”，而后掉头就走。路明非没有接鼠标，用的是老式 IBM 笔记本上面那个红点控制。谁都知道红点控制打竞技类游戏有多难，好比拿着一根擀面杖掏耳朵。但是路明非也懒得和那兄弟强调说他自己纯属无聊在挑战高难度，因为他自己也觉得这样做很无聊。靠微操打赢了频道里全部的人之后改用左手打，左手打赢了就扔掉鼠标用红点打，如果有一天他用红点都打遍全频道，又用什么办法来消磨时间呢？
　　何必呢？何苦呢？他有时候也跟自己说。老是打着一个老游戏等啊等，可她很少上线。
　　“一箱打折的袋装奶，半斤广东香肠，还有鸣泽要的新一期《最小说》，买完了赶快回来，把桌子上的芹菜给我摘了！还有去传达室看看有没有录美国来的信！还玩游戏？自己的事情一点不上心，要没人录取你，你考得上一本么？在你身上花了那么多钱，有什么用？” 婶婶的声音在隔壁炸雷般响起。古龙小说集
　　路明非觉得脑袋被震得嗡嗡作响，一叠声地答应着，一溜小跑出门。走廊里安安静静，他靠在门上，听见门里的婶婶还是嘟嘟哝哝地抱怨。下午的阳光从楼道尽头的窗户照进来，暖洋洋地洒在他身上，走道里晾晒着纯白色的床单，窗外风吹着油绿的树叶摇曳，哗哗地响。
　　又是春天了，路明非这一年十八岁。
　　他和叔叔婶婶一起住，有一个名叫路鸣泽的堂弟，就读于当地最有名私立高中，学费高昂，师尊严苛，豪车如流水，美女如流云。还有三个月零四天他就得参加高考，这些天仿佛整个世界都在他耳边咆哮，告诉他末日就要到来，他应该焕发斗志，像只杀气横溢的斗鸡般扑在模考卷子上，显示出头悬梁锥刺股的决心。
　　可压力越大，路明非越懒，除了打《星际争霸》那个老游戏，就是躺在床上看着屋顶发呆，对于自己的前途全然提不起兴趣。
　　作为一个没什么存在感的人，他的懒惰并不难理解。
　　路明非有六年多没见过爸妈了，好消息是据说他们都还活着，每半年还会写封信给他，坏消息是每次来信妈妈都遗憾地告诉他回国探望他的计划又要推迟，因为 “事情又有了新的进展”。他的爸妈都是考古专家，据说在忙一个大项目，结果一旦公布就会像斯文・赫定发现楼兰古城那样震惊世界。上初中时，路明非很为有这样的爸妈而自豪，读了很多考古方面的书，在放学的路上和同学津津乐道。但他很快发现该自豪的是放学时有爸妈开车来接的兄弟们。每每放学之后，一帮同学吊儿郎当地并排往前走，占了几乎半条街的路面，后面就一次次响起汽车喇叭声，然后队伍中立刻有个兄弟收敛了摇摆的幅度，老老实实的钻进自家的车绝尘而去。人一个个地少下去，最后往往只剩下路明非一个人，继续摇摆着向前。
　　兄弟们隔着车窗玻璃看出去，路明非的背影踢着石头自由自在地远去，于是非常地羡慕，羡慕他可以随便去哪儿，想逛商场逛商场，想买吃的买吃的，还能去打台球，反正他家管得不严，放学从不来接。中小学教育
　　但其实路明非一个人的时候不逛商场也不打台球。他在网吧里坐得发腻之后，就回家了，进了楼却不进屋，从通往楼顶的铁栅栏里钻过去，坐在嗡嗡响的空调机旁边眺望这个城市，直到太阳西下。
　　路明非觉得自己的爸妈像是男女超人，也许只有某一天他坐的飞机失事了，他们才会忽然出现在他面前，托着飞机平安落地。若不是那样，他们始终在为世界忙碌，而不是为了他路明非。超人爸妈当然可以用来吹嘘，可事实上跟不存在也没什么区别，路明非都快记不得爸妈的长相了，只有偶尔看小时候爸妈和他在自家客厅里的合影时，才能勉强回忆起那一男一女，还有他家那栋外面爬满爬山虎的老楼。
　　叔叔婶婶对于路明非爸妈每次从国外寄回来的钱兴趣更大，而不是路明非这个人。托那笔钱的福，路明非可以上那个私立高中，也是托那笔钱的福，叔叔婶婶能买一辆小排量的宝马车，叔叔有钱去买一些仿得很像的名牌货，婶婶有钱在麻将桌上输，还是托那笔钱的福，他的堂弟路鸣泽在学校里有了 “泽太子” 的绰号。路鸣泽和他在同一所高中上学，不但成绩比他好，穿衣服也比他精致，而且只要有女孩一起吃饭就抢着给钱，叔叔婶婶还会穿得特别体面参加路鸣泽的家长会，让人感觉路鸣泽是个蜜罐里泡大的孩子，而他路明非就是 “路鸣泽的哥哥”。
　　路明非倒也不是很介意，反正他是个没什么存在感的人。
　　连爸妈都不在乎他，对叔叔婶婶还能有多高的要求？
　　路明非两手抄在裤兜里，歪着脑袋看着地面，一路下楼，在便利店里买了婶婶要的袋装奶和广东香肠，又溜达到书摊上，买了一本新出的《最小说》。婶婶觉得路鸣泽就是聪明，好读书，求上进，还特别热爱文学，路鸣泽看《最小说》在婶婶的嘴里也是 “我们家鸣泽在学习”，每次那个杂志出新一期婶婶比路鸣泽知道得都清楚，赶着路明非去买，搞得楼下报刊亭的大爷觉得路明非是个忧郁的孩子。但其实路明非很白烂，每次买完《最小说》就靠在报刊亭边把新一期的《家用电脑与游戏》看完，然后扔回摊上，坦荡荡地评价说家游越来越不好看了，拍拍屁股走人。人与社会
　　路明非有点蔫儿坏，比如他不喜欢路鸣泽，但他总是访问路鸣泽那个秘密的 QQ 空间。路鸣泽看了《最小说》，给自己起了一个笔名叫 “寂寞的贪吃蛇”，抄了很多哀伤的句子放在 QQ 空间里，配上他自己用 手机拍的大头照，偶尔还上载几张用点红墨水抹在手腕上冒充割腕的照片，配的诗大概是说没有爱就要去死的意思。路明非知道堂弟春心思动，在学校里还没有泡到心仪的女生，所以想在 QQ 上遭遇点天雷地火。于是他新申请了一个 QQ 号起名叫 “夕阳的刻痕”，挂上一张短发娇俏萝莉的照片，把年龄填成 16 岁，性别填成女，个性签名写成 “让你的微笑和悲伤成为我这一生的刻痕”。趁着路鸣泽在家上网的时候，他就溜去网吧和 “寂寞的贪吃蛇” 搭讪。三来两去，路鸣泽大概觉得他这条贪吃蛇终于找到食物了，他也愿意让自己的微笑和悲伤成为女生这一生的刻痕，于是每天都很高兴哼着信乐团的《离歌》，一再地约见面，想要轰轰烈烈地开始一次。路明非就总是约在婶婶拎路鸣泽去学钢琴的时候，路鸣泽总见不着 “夕阳的刻痕”，唱着《离歌》的时候也就有点哀愁的调门儿。这是路明非这些日子来最开心的一件事了。
　　路明非就是这么一个人，没有多好，也没什么做坏事的本事，活到十八岁，还不知道自己的未来在哪里。
　　“明非啊，都说你要去留学啊。” 报摊的大爷在他翻看不要钱的家游时忽然想了这茬。

　　“一定是骗子搞的！而且是小区里的熟人！熟人才知道我们家有钱，明非又申请出去念书，搞这种事来戏弄我们！” 婶婶一掌拍在那封信上，说得斩钉截铁。
　　“可谁会为了戏弄我们就送只手机过来？N96 诶，现在水货都卖四千多块，行货超五千了。” 叔叔在那只纯黑的 N96 上不断地印着自己的指纹，像是一个老女人抚摩祖传的翡翠镯子。
　　叔叔是个很讲究的人，总在饭桌上喋喋不休地告诉路明非和路鸣泽， 手机、手表、打火机三件套是男人的身份和品位。袜子是十块钱四双的地摊货还是五十块一双的高档羊毛货不容易看出来，可这三件套是要放在桌上给人看的。路明非偶尔有幸和叔叔一起出去赴饭局，确实看见叔叔左手手机右手打火机，不轻不重地拍在桌上，又在聊天中不经意地捋起袖子露出那块广州买的高仿万宝龙表，赢得大家对他品位的一致称赞。最近叔叔对他磨损得有点厉害的三星手机很是不满，总在一些手机网站上搜索新手机的评测和价格，他不只一次的跟路鸣泽说起新出的 N96 很 “高级”，不过为了给路明非支付那些申请费，掌握家里财政大权的婶婶说什么也不同意他换手机。

　　路明非就是这样一个人，当别人都朝上进方向去想的时候，他就会莫名其妙朝着反的方向去联想。
　　路明非的语文老师有一次拿他的作文作为反面例子在课上大加挞伐，说这篇作文看起来毫无幻想精神，透着悲观主义的情绪，所以也不会有进取心。
　　路明非当时很有站起来说点什么的冲动。他小时候看葛优和徐帆演的《不见不散》，徐帆说葛优没理想没出息，葛优急了，在黑板上画一个珠穆朗玛峰，把中段炸了，说我也有理想，我的理想是把珠穆朗玛峰炸开一个口子，这样西南的暖风能够进入青藏高原，把雪域绝地化作江南水乡！可语文老师批评的时候目光远大高瞻远瞩，直视教室最后几排正在打瞌睡的同学，所以连眼角的余光都没有瞟向路明非，更没有要他解释一下自己写作文时的心路历程，所以路明非也就失去了站起来为自己辩护的机会。
　　路明非的幻想分为两个阶段。初中时他还对自己考古学家的爸妈很是敬仰，于是幻想自己成为印第安纳？琼斯，和他那对靠不住的爸妈组一个探险队，在巴西的雨林里寻觅南美古城。
　　到了高中时，路明非的幻想上了一个层次，那是源自他某一次看了三部连映的《黑客帝国》，他觉得自己应该有种非常神奇的能力还没有被发掘出来，像 “Neo” 那样，是 “theone”。某一天会有一个神秘人物来发掘他这个能力，他将在众人灼灼的目光里摇身一变…… 至于变成什么他还没想好。每次学校办春节联欢晚会时班里那个钢琴十级的小美女柳淼淼在舞台上弹琴，同班男生一身黑色礼服围着钢琴翩翩起舞，路明非就托在腮帮子坐在一个被人遗忘的角落里，浮想联翩，想着也许会有一架直升飞机从天而降来接他，有一群黑衣墨镜男以电影里面 CIA 特工般的冷酷走进会场，沉着嗓子说，路明非先生，不是看春节联欢晚会的时候了，组织在召唤你，战争就要爆发。然后他们会给路明非套上黑色不知名的军服和长风衣，簇拥着他在同学们的目光中离开会场，会场外一架漆黑的直升机轰响着，巨大的旋翼掀起狂风，如刀割面。那时候无论是小美女柳淼淼还是跳舞的男生，都会停下来呆呆地看着路明非的背影。学院与大学
　　每年生日路明非都会想会不会有直升飞机来接他，但从十五岁到十八岁，他连直升飞机的毛都没看见过。

　　可这个昏了头的卡塞尔学院居然把录取通知书发给了路明非。

　　这是他第一次在野战中遭遇那么强的对手，他起了好胜心，决定冒险把主基地提升到三级，出动吞噬者、守护者和猛犸这 “三套车”，这是一个根本的战略转型，如果对方稍有犹豫，没有趁他把资源花去升级的间隙进攻，路明非就必然能取胜。

　　快了，很快升级就要完成，“三套车” 精锐部队空地并进，可以一个接一个扎实地吃掉敌人的基地。路明非感觉到了胜利的曙光。
　　“你在升三级基地。” 这时候屏幕下方跳出了一行字。
　　路明非愣住了。

　　诺诺没有回答，留了一个咧着满嘴大牙狂笑的表情，下线了。

　　3. 见面人与社会
　　次日上午，丽晶酒店。
　　这是这座小城市里最豪华的酒店，全球连锁，五星级，路明非叔叔喜欢在这里的大堂喝喝茶跟朋友们聊天，一直让服务员续水到酽茶变白开水，这样花费不高，还能让他有享受世界顶级服务的优越感。叔叔代替路明非打电话给那位古德里安教授，教授非常高兴地表示他已经到了这里，入住在丽晶酒店。叔叔立刻诚挚地表示他是丽晶的老客户，非常熟悉，然后顺理成章地约了早饭。

　　路明非从未被人冠以 “先生” 的称呼，急忙起身。
　　“我们的客人古德里安教授让把早餐安排在九楼的 VIP 旋转吧了，让我来通知一下。”
　　“我也是熟客了，怎么不知道还有 VIP 旋转吧这东西？” 叔叔有些费解。
　　“是这样的，VIP 旋转吧不对外开放，只开放给商务套间和总统套房的客人免费使用，古德里安教授订的就是总统套房。”
　　“总统套房？” 叔叔吃了一惊。
　　“美国学校真有钱！” 婶婶瞬间忘记了她原本来是要验明这个学校的正身，看那封信是否一个骗局，在总统套房前，她忽然对这个卡塞尔学院肃然起敬。
　　VIP 电梯把一家四口直送到顶层，电梯门打开的瞬间，银色头发的魁梧老人迎了上来，扫视了一眼之后，准确地握住了路明非的手，“你好！路明非！”
　　“你好…… 古德里安教授，你的中文说得真好。” 路明非立刻开始怯场。
　　在这个只有他们一群人的 VIP 旋转吧里，桌布雪白餐具银亮，放眼看出去是这个城市最漂亮的湖景，他居然被当作一个什么重要人物接待了，他完全不能适应这个地位提升，越发有一种即将被人骗卖的担心。

　　“可我得学英语不是么……” 路明非咧嘴，“我的托福成绩也一般。”
　　“不，没必要，” 古德里安教授非常诚恳地说，“我们从七年前就开始推行‘中文校园’项目，现在在校园里，无论什么人都说中文，从教授到图书馆管理员，包括保洁阿姨！所以我们根本就没有考虑你的英语成绩！” 教育
　　见鬼，路明非心想，如果连那份勉强够格的托福成绩单他们都没考虑，那到底是看重他什么？一份高中各科平均分没过 80 的成绩单？一份干巴巴的个人自述？没有任何亮点的人生…… 面对这么一个申请者，这教授怎么就能露出欢天喜地的表情来？

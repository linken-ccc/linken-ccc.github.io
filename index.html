<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 移动端自适应 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>林 | Personal Page</title>
    <style>
        /* 全局样式重置，统一简约基调 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
        }

        :root {
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-main: #222222;
            --text-second: #555555;
            --text-light: #777777;
            --text-hint: #aaaaaa;
            --border-line: #cccccc;
            --hover-text: #000000;
            --shadow: rgba(0, 0, 0, 0.06);
            --modal-mask: rgba(0, 0, 0, 0.4);
        }
        /* 深色主题变量 */
        body.dark {
            --bg-color: #121418;
            --card-bg: #1e2127;
            --text-main: #f0f0f0;
            --text-second: #c8c8c8;
            --text-light: #999999;
            --text-hint: #666666;
            --border-line: #444444;
            --hover-text: #ffffff;
            --shadow: rgba(0, 0, 0, 0.3);
            --modal-mask: rgba(0, 0, 0, 0.7);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        /* 默认隐藏主页内容（密码验证） */
        .main-content{
            display: none;
            width: 100%;
            position: relative;
        }

        /* 页面容器 */
        .page-wrap {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* 页面卡片样式 */
        .page {
            text-align: center;
            padding: 80px 60px;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 8px 30px var(--shadow);
            max-width: 520px;
            width: 90%;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.4s ease, transform 0.4s ease, background 0.4s;
            position: absolute;
            pointer-events: none;
        }
        .page.active {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        /* 姓名主标题 */
        .name {
            font-size: 46px;
            font-weight: 500;
            letter-spacing: 12px;
            margin-bottom: 16px;
        }

        /* 英文副标题 */
        .en-name {
            font-size: 16px;
            color: var(--text-light);
            letter-spacing: 3px;
            margin-bottom: 40px;
            font-weight: 300;
        }

        /* 分割细线 */
        .line {
            width: 70px;
            height: 1px;
            background: var(--border-line);
            margin: 0 auto 40px;
        }

        /* 简介文字区域 */
        .intro {
            font-size: 15px;
            color: var(--text-second);
            line-height: 2;
            margin-bottom: 30px;
        }

        /* 文件列表样式 第4页使用 */
        .file-list {
            text-align: left;
            max-width: 300px;
            margin: 0 auto;
            font-size:15px;
        }
        .file-item {
            padding:8px 0;
            color:var(--text-second);
            display:flex;
            align-items:center;
            gap:8px;
            cursor: pointer;
            transition: all 0.25s ease;
            border-radius: 6px;
            padding-left: 6px;
        }
        .file-item:hover{
            color:var(--hover-text);
            padding-left:12px;
            background: rgba(128,128,128,0.08);
        }
        .folder-icon::before{
            content:"📁";
        }
        .txt-icon::before{
            content:"📄";
        }

        /* 弹窗样式 */
        .modal{
            display:none;
            position:fixed;
            top:0;
            left:0;
            width:100%;
            height:100%;
            background:var(--modal-mask);
            z-index:999;
            align-items:center;
            justify-content:center;
        }
        .modal-box{
            background:var(--card-bg);
            width:90%;
            max-width:480px;
            padding:30px;
            border-radius:12px;
            transition: background 0.4s;
        }
        .modal h3{
            margin-bottom:16px;
            color: var(--text-main);
        }
        .modal-content{
            min-height:120px;
            line-height:1.8;
            color:var(--text-second);
            white-space:pre-wrap;
        }
        .close-modal{
            margin-top:20px;
            padding:8px 24px;
            border:1px solid var(--border-line);
            background:transparent;
            color: var(--text-main);
            border-radius:6px;
            cursor:pointer;
            transition: 0.2s;
        }
        .close-modal:hover{
            background: rgba(128,128,128,0.1);
        }
        .modal.show{
            display:flex;
        }

        /* 导航链接行 */
        .links {
            display: flex;
            gap: 36px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .links a {
            text-decoration: none;
            color: var(--text-second);
            font-size: 14px;
            letter-spacing: 1px;
            transition: color 0.3s;
        }
        .links a:hover {
            color: var(--hover-text);
        }

        /* 翻页箭头 */
        .arrow {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            font-size: 40px;
            color:var(--text-light);
            cursor: pointer;
            user-select: none;
            transition: color 0.3s;
            padding: 16px;
            z-index: 10;
        }
        .arrow:hover{
            color: var(--hover-text);
        }
        .prev {
            left: 30px;
        }
        .next {
            right: 30px;
        }
        /* 不可点击时变浅 */
        .arrow.disabled{
            color:#666;
            opacity:0.3;
            cursor: default;
            pointer-events: none;
        }

        /* 页码指示器 */
        .page-index{
            position: fixed;
            bottom: 60px;
            font-size:13px;
            color:var(--text-light);
        }

        /* 底部小字版权 */
        .footer {
            position: fixed;
            bottom:20px;
            font-size: 12px;
            color: var(--text-hint);
            text-align:center;
            width:100%;
            line-height:1.6;
        }

        /* 主题切换按钮 */
        .theme-btn {
            position: fixed;
            bottom: 60px;
            right: 30px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1px solid var(--border-line);
            background: var(--card-bg);
            color: var(--text-main);
            font-size: 18px;
            cursor: pointer;
            z-index: 10;
            transition: all 0.3s;
        }
        .theme-btn:hover {
            transform: scale(1.1);
        }

        /* 手机端适配 */
        @media (max-width: 480px) {
            .name {
                font-size: 32px;
                letter-spacing: 8px;
            }
            .page {
                padding: 50px 30px;
            }
            .prev{
                left:0;
            }
            .next{
                right:0;
            }
            .arrow{
                font-size:28px;
                padding:20px 10px;
            }
            .theme-btn {
                right: 15px;
                bottom: 50px;
            }
        }
    </style>
    <!-- 访问统计 -->
    <script src="//cdn.busuanzi.cc/busuanzi/3.6.9/busuanzi.min.js" defer></script>
</head>
<body>
    <div class="main-content">
        <!-- 主题切换按钮 -->
        <button class="theme-btn" id="themeToggle">🌙</button>

        <!-- 左箭头 -->
        <div class="arrow prev" id="prevBtn">←</div>
        <!-- 右箭头 -->
        <div class="arrow next" id="nextBtn">→</div>

        <div class="page-wrap">
            <!-- 第1页 -->
            <div class="page active" data-page="1">
                <h1 class="name">林</h1>
                <p class="en-name">LIN</p>
                <div class="line"></div>
                <div class="intro">
                    这是我的小站
                </div>
            </div>

            <!-- 第2页 -->
            <div class="page" data-page="2">
                <h1 class="name">你好</h1>
                <p class="en-name">HELLO</p>
                <div class="line"></div>
                <div class="intro">
                    很高兴与你相遇
                </div>
            </div>

            <!-- 第3页 -->
            <div class="page" data-page="3">
                <h1 class="name">这是我的网站</h1>
                <p class="en-name">MY WEBSITE</p>
                <div class="line"></div>
                <div class="intro">
                    欢迎来到我的个人主页
                </div>
            </div>

            <!-- 第4页【文件页面】 -->
            <div class="page" data-page="4">
                <h1 class="name">文件</h1>
                <p class="en-name">FILE LIST</p>
                <div class="line"></div>
                <div class="intro">
                    站内文件清单（点击文件打开）
                </div>
                <div class="file-list">
                    <div class="file-item folder-icon" data-file="archive">archive（文件夹）</div>
                    <div class="file-item txt-icon" data-file="note01">note01.txt</div>
                    <div class="file-item txt-icon" data-file="note02">note02.txt</div>
                    <div class="file-item txt-icon" data-file="readme">readme.txt</div>
                </div>
            </div>
        </div>

        <!-- 文件弹窗 -->
        <div class="modal" id="fileModal">
            <div class="modal-box">
                <h3 id="modalTitle"></h3>
                <div class="modal-content" id="modalText"></div>
                <button class="close-modal">关闭</button>
            </div>
        </div>

        <!-- 页码显示 -->
        <div class="page-index" id="pageText">第 1 / 4 页</div>

        <!-- 底部版权 & 访问统计 -->
        <div class="footer">
            © 2026 林 All Rights Reserved<br>
            今日总访问量 <span id="busuanzi_today_pv">--</span> 次
            今日总访客数 <span id="busuanzi_today_uv">--</span> 人<br>
            本站总访问量 <span id="busuanzi_site_pv">--</span> 次
            本站总访客数 <span id="busuanzi_site_uv">--</span> 人<br>
            本页总阅读量 <span id="busuanzi_page_pv">--</span> 次
            本页总访客数 <span id="busuanzi_page_uv">--</span> 人
        </div>
    </div>

<script>
// 访问密码
const PASSWORD = "123456";

// 文件内容配置，你可以自由修改里面文字
const fileData = {
    archive: "【archive 文件夹】\n这是一个归档文件夹，存放历史资料。\n内部文件：暂无开放。",
    note01: "笔记01\n记录一些日常想法。",
    note02: "笔记02\n零碎备忘录。",
    readme: "欢迎访问本站！\n这是个人简易站点。"
};

window.onload = function(){
    // 读取本地存储主题
    initTheme();

    let inputPwd = prompt("请输入访问密码：");
    // 用户点击取消直接关闭页面，不再弹窗循环
    if(inputPwd === null){
        document.body.innerHTML = "<div style='display:flex;justify-content:center;align-items:center;height:100vh;color:#777'>已取消访问</div>";
        return;
    }
    // 密码错误循环弹窗
    while(inputPwd !== PASSWORD){
        inputPwd = prompt("密码错误，请重新输入！点击取消关闭页面");
        if(inputPwd === null){
            document.body.innerHTML = "<div style='display:flex;justify-content:center;align-items:center;height:100vh;color:#777'>已取消访问</div>";
            return;
        }
    }

    document.querySelector('.main-content').style.display = 'block';
    initPageSwitch();
    initFileModal();
}

// 主题切换初始化
function initTheme(){
    const body = document.body;
    const themeBtn = document.getElementById('themeToggle');
    const saveTheme = localStorage.getItem('site-theme');
    // 读取本地存储主题
    if(saveTheme === 'dark'){
        body.classList.add('dark');
        themeBtn.innerText = '☀️';
    }else{
        body.classList.remove('dark');
        themeBtn.innerText = '🌙';
    }
    // 切换点击事件
    themeBtn.onclick = ()=>{
        body.classList.toggle('dark');
        if(body.classList.contains('dark')){
            themeBtn.innerText = '☀️';
            localStorage.setItem('site-theme','dark');
        }else{
            themeBtn.innerText = '🌙';
            localStorage.setItem('site-theme','light');
        }
    }
}

// 文件弹窗初始化
function initFileModal(){
    const modal = document.getElementById('fileModal');
    const modalTitle = document.getElementById('modalTitle');
    const modalText = document.getElementById('modalText');
    const closeBtn = document.querySelector('.close-modal');
    const fileItems = document.querySelectorAll('.file-item');

    // 点击文件打开弹窗
    fileItems.forEach(item=>{
        item.onclick = function(){
            const fid = this.dataset.file;
            modalTitle.innerText = this.innerText;
            modalText.innerText = fileData[fid];
            modal.classList.add('show');
        }
    })
    // 关闭弹窗
    closeBtn.onclick = ()=> modal.classList.remove('show');
    modal.onclick = (e)=>{
        if(e.target === modal) modal.classList.remove('show');
    }
    // ESC按键关闭弹窗
    document.addEventListener('keydown', (e)=>{
        if(e.key === 'Escape' && modal.classList.contains('show')){
            modal.classList.remove('show');
        }
    })
}

// 翻页逻辑
function initPageSwitch(){
    const pages = document.querySelectorAll('.page');
    const totalPage = pages.length;
    let current = 1;

    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const pageText = document.getElementById('pageText');

    function updateUI(){
        pages.forEach(p=>p.classList.remove('active'));
        document.querySelector(`.page[data-page="${current}"]`).classList.add('active');
        pageText.innerText = `第 ${current} / ${totalPage} 页`;

        prevBtn.classList.toggle('disabled', current === 1);
        nextBtn.classList.toggle('disabled', current === totalPage);
    }

    prevBtn.onclick = ()=>{
        if(current > 1){
            current--;
            updateUI();
        }
    }
    nextBtn.onclick = ()=>{
        if(current < totalPage){
            current++;
            updateUI();
        }
    }

    // 新增：键盘 ← → 方向键翻页
    document.addEventListener('keydown', (e)=>{
        // 弹窗打开时禁止翻页
        const modal = document.getElementById('fileModal');
        if(modal.classList.contains('show')) return;

        if(e.key === 'ArrowLeft' && current > 1){
            current--;
            updateUI();
        }
        if(e.key === 'ArrowRight' && current < totalPage){
            current++;
            updateUI();
        }
    })

    updateUI();
}
</script>
</body>
</html>
